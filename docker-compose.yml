services:
  gdrive-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data     # токен Google — переживает пересборку контейнера
      - ./logs:/app/logs     # журнал изменений
